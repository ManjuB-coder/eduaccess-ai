name: eduaccess_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # 🔥 FIREBASE
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # 🎤 SPEECH & AUDIO
  speech_to_text: ^6.1.1
  flutter_tts: ^4.2.3

  # 🌐 API
  http: ^1.5.0

  # 📄 PDF & FILE PICKER
  file_picker: ^10.3.2
  syncfusion_flutter_pdf: ^31.1.17

  # 🎬 UI & STORAGE
  video_player: ^2.7.0
  lottie: ^2.7.0
  shared_preferences: ^2.2.2
  smooth_page_indicator: ^1.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/